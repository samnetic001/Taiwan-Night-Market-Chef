[limits]
discussion_rounds = 3
repair_attempts = 1
concurrent_agents = 2
agent_timeout_seconds = 900
max_invocations = 24
run_timeout_seconds = 5400

[agents]
codex = "/opt/homebrew/bin/codex"
antigravity = "/Users/samlin/.local/bin/agy"

[models]
